# ── 4) 🎨 muse（原 🔤 country1；规则仍是 muse/meta/facebook 关键词）──
DOMAIN-KEYWORD,muse,🎨 muse
DOMAIN-KEYWORD,meta,🎨 muse
DOMAIN-KEYWORD,facebook,🎨 muse

# ── 5) 你自己的 ProxyLite.list ──
