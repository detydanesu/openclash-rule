# 原 ini 里 🎯 全球直连 第一项是「手动切换」，要真直连得自己选 DIRECT。
# 这里默认设成第 3 项 DIRECT（select 从 0 数，所以是 2），开箱即用。
🎯 全球直连 = select, 🐸 手动切换, ♻️ 自动选择, DIRECT, REJECT, select=2
🐟 漏网之鱼 = select, 🐸 手动切换, ♻️ 自动选择, DIRECT, REJECT, select=0

[Rule]
# ── 1) 私有 / 局域网（原 ini: GEOSITE,private → 等价的 Lan 规则集）──
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Lan/Lan.list,🎯 全球直连

# ── 2) 关键词直连（原 ini: []DOMAIN-KEYWORD,icloud / qidian）──
#    必须内联：放进 Direct.list 会被 OpenClash 的 domain 类型转换丢掉。
DOMAIN-KEYWORD,icloud,🎯 全球直连
DOMAIN-KEYWORD,qidian,🎯 全球直连

# ── 3) 你自己的直连清单（校园网 / 米哈游 / Steam 下载 CDN 都在里面）──
