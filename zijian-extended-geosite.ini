[custom]
; Local OpenClash template for SubConverter-Extended.
; Uses Mihomo's built-in GEOSITE/GEOIP databases to avoid fragile remote rule expansion.

ruleset=🎯 全球直连,[]GEOSITE,private

; Current OpenClash custom direct rules.
; Keep these rules above the general game/media and final matching rules.
;
; DOMAIN-KEYWORD has to stay inline here: OpenClash fetches Direct.list through
; api.asailor.org with behavior=domain, which silently drops keyword rules
; (verified: 513 rules in -> 512 out). Everything else that used to be listed
; here -- cqu.edu.cn / bhsr.com / mihoyo.com and the Steam download CDN -- now
; lives inside Direct.list itself.
ruleset=🎯 全球直连,[]DOMAIN-KEYWORD,icloud
ruleset=🎯 全球直连,[]DOMAIN-KEYWORD,qidian

ruleset=🎯 全球直连,https://raw.githubusercontent.com/detydanesu/openclash-rule/refs/heads/main/Direct.list
ruleset=🎨 muse,[]DOMAIN-KEYWORD,muse
ruleset=🎨 muse,[]DOMAIN-KEYWORD,meta
ruleset=🎨 muse,[]DOMAIN-KEYWORD,facebook
ruleset=🚀 默认代理,https://raw.githubusercontent.com/detydanesu/openclash-rule/refs/heads/main/ProxyLite.list
ruleset=💧 Copilot,[]GEOSITE,bing
ruleset=🤖 AI,[]GEOSITE,category-ai-!cn
ruleset=📹 YouTube,[]GEOSITE,youtube
ruleset=🐬 OneDrive,[]GEOSITE,onedrive
ruleset=📢 FCM,[]GEOSITE,googlefcm
ruleset=👨🏿‍💻 GitHub,[]GEOSITE,github
ruleset=🪟 Microsoft,[]GEOSITE,microsoft
ruleset=🍀 Google,[]GEOSITE,google
ruleset=🍎 Apple,[]GEOSITE,apple
ruleset=♻️ Speedtest,[]GEOSITE,speedtest
ruleset=🎵 TikTok,[]GEOSITE,tiktok
ruleset=🎥 Netflix,[]GEOSITE,netflix
ruleset=📲 Telegram,[]GEOSITE,telegram
ruleset=🎯 全球直连,[]GEOSITE,steam@cn
ruleset=🚀 默认代理,[]GEOSITE,steam
ruleset=🎮 游戏平台,[]GEOSITE,category-games
ruleset=🌍 国外媒体,[]GEOSITE,category-entertainment
ruleset=🎞️ 国内媒体,[]GEOSITE,category-media-cn
ruleset=🎯 全球直连,[]GEOSITE,CN
ruleset=🎯 全球直连,[]GEOIP,CN,no-resolve
ruleset=🚀 默认代理,[]GEOSITE,geolocation-!cn
ruleset=🐟 漏网之鱼,[]FINAL

